<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paolo Quispe Quiroz – Cursos y contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1C2128; --muted:#69727D; --line:#DDE1E6; --accent:#1F6F6B; --on-accent:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171B;--surface:#1D2127;--ink:#ECEFF2;--muted:#9AA3AD;--line:#2C323A;--accent:#5BB8B2;--on-accent:#0F1416}
}
:root[data-theme="dark"]{--bg:#14171B;--surface:#1D2127;--ink:#ECEFF2;--muted:#9AA3AD;--line:#2C323A;--accent:#5BB8B2;--on-accent:#0F1416}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:56px 20px 48px}
header{text-align:center;margin-bottom:36px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:34px;font-weight:700;overflow:hidden}
.logo{width:44px;height:44px;border-radius:8px;flex:none;object-fit:cover}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.bio{margin:0 auto;max-width:34ch;color:var(--muted);font-size:16px}
h2{margin:32px 0 10px;font-size:15px;font-weight:500;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.btn{display:flex;align-items:center;gap:12px;min-height:54px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:16px;font-weight:500;transition:border-color .15s,background .15s}
a.btn:hover{border-color:var(--accent)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a.btn svg{width:20px;height:20px;flex:none;fill:currentColor}
a.btn span{flex:1}
a.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);justify-content:center}
a.primary span{flex:none}
a.primary:hover{border-color:var(--accent);filter:brightness(1.08)}
footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
